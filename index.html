<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Outfit:100,200,300,regular,500,600,700,800,900" rel="stylesheet" />
    <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
    <main>
            <div class="card">
            <img src="./images/image-equilibrium.jpg" alt="Equilibrium" class="equilibrium-image">
            <h3 tabindex="0">Equilibrium #3429</h3>
            <p class="info"> Our Equilibrium collection promotes balance and calm.</p>
            <div class="eth-and-time">
                <div class="eth-image">
                    <img src="./images/icon-ethereum.svg" alt="etherum icon">
                    <p>0.041 ETH</p>
                </div>
                <div class="time-left">
                    <img src="./images/icon-clock.svg" alt="clock-icon">
                    <p>3 days left</p>
                </div>
            </div>
            <div class="author">
                <img src="./images/image-avatar.png" alt="author">
                <p>Creation of <span>Jules Wyvern</span></p>
            </div>
        </div>

    </main>
    <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Noman Gorchani</a>.
  </footer>
</body>
</html>
